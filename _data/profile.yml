bio: >-
  Dr. Onur Cankur is a postdoctoral researcher at IT4Innovations, VŠB–Technical University of Ostrava. His research interests span high-performance computing and AI, with a focus on performance analysis, operational data analytics, GPU systems, and energy-efficient computing. He studies how runtime hardware settings can adapt to workload behavior to reduce energy use, and also explores how large language models can support performance diagnosis. He received his Ph.D. in Computer Science from the University of Maryland, College Park, where he studied code-level performance analysis, large-scale supercomputer telemetry, run-to-run performance variability, and predictive modeling using GPU, network, and system-level measurements. He has collaborated with researchers at Lawrence Berkeley National Laboratory and Pacific Northwest National Laboratory. He also contributes to open-source software for analyzing the performance of parallel applications, including Hatchet and Pipit. Earlier, at Hacettepe University, he worked on GPU-accelerated string-matching algorithms and distributed data storage using blockchain.
