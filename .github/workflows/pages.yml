name: Build and publish academic site

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:format
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - run: npm run check:site
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          path: _site
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
