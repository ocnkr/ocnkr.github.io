# Onur Cankur — al-folio v1 academic website
# Runtime templates and base styles are supplied by the pinned al_folio_core gem.
title: blank
first_name: Onur
last_name: Cankur
lang: en-US
description: >-
  Onur Cankur is a postdoctoral researcher at IT4Innovations, VŠB–Technical University of Ostrava,
  working on high-performance computing, AI, operational data analytics, GPU systems, energy-efficient computing,
  and LLM-assisted performance diagnosis.
keywords: high-performance computing, GPU, performance analysis, operational data analytics, system telemetry, energy efficiency, AI, LLM-assisted diagnosis
url: https://ocnkr.github.io
baseurl: ""
repository: ocnkr/ocnkr.github.io
email: onur.cankur@vsb.cz
icon: favicon.svg
og_image: /assets/img/onur-cankur.png
serve_og_meta: true
serve_schema_org: true
max_width: 1040px
navbar_fixed: false
footer_fixed: false
back_to_top: false
last_updated: false
protect_email: false

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: true
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

theme: al_folio_core
plugins:
  - jekyll-3rd-party-libraries
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - al_folio_core
  - al_folio_cv
  - al_folio_upgrade
  - al_icons

include: ["_pages"]
exclude:
  - vendor/
  - node_modules/
  - scripts/
  - tests/
  - test-results/
  - playwright-report/
  - playwright.config.js
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - LICENSE-al-folio
  - AGENTS.md
  - al-folio-upgrade-report.md
  - .al-folio-overrides.yml
  - talkmap/

collections:
  news:
    output: false
  projects:
    output: true
    permalink: /software/:name/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
sass:
  style: compressed
permalink: /:categories/:title/
timezone: Europe/Prague
strict_front_matter: true

scholar:
  first_name: [Onur, O.]
  last_name: [Cankur]
  style: apa
  locale: en-US
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending
  sort_by: year, month
  order: descending
filtered_bibtex_keywords: [abbr, abstract, bibtex_show, category, code, html, pdf, poster, selected, slides, summary]
max_author_limit: 0
enable_publication_thumbnails: false
enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false

search_enabled: false
bib_search: false
enable_darkmode: true
enable_masonry: false
enable_math: false
enable_medium_zoom: false
enable_progressbar: false
enable_cookie_consent: false
enable_navbar_social: false
newsletter:
  enabled: false
imagemagick:
  enabled: false

# No remote fonts or icon requests are needed for this site.
third_party_libraries:
  download: false
  google_fonts:
    url:
      fonts: /assets/css/fonts.css
  fontawesome:
    url:
      css: /assets/css/icons.css
  academicons:
    url:
      css: /assets/css/icons.css
  scholar-icons:
    url:
      css: /assets/css/icons.css

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: "images"
    values:
      sitemap: false
  - scope:
      path: "files"
    values:
      sitemap: false
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      nav: false
